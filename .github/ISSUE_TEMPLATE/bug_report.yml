name: Template bug
description: Report an installation, startup, networking, command, or backup problem
title: "[Template bug]: "
labels:
  - template
  - bug
body:
  - type: input
    id: template
    attributes:
      label: Template and catalog version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Host OS and architecture
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant game process output
      description: Paste only relevant raw output. Redact all credentials and personal data.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: I removed credentials, webhook URLs, tokens, private files, and personal information.
          required: true
